name: nuvio_launcher
description: Nuvio Launcher - a futuristic Minecraft launcher by Kazama Tech (beta).
publish_to: 'none'
version: 0.1.0-beta.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  crypto: ^3.0.5
  archive: ^3.6.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  uuid: ^4.5.1
  window_manager: ^0.4.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon.png
    - assets/brand/badge.png
    - assets/wallpapers/

# Launcher icons: see flutter_launcher_icons-android.yaml / -windows.yaml (one per platform, run by CI).
